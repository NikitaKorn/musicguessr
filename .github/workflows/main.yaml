name: Java CI with Maven

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile

      - name: Run tests
        run: mvn test
        env:
          GENIUS_TOKEN: ${{ secrets.GENIUS_TOKEN }}
          PLAYER_FILE_PATH: ${{ vars.PLAYER_FILE_PATH }}
          WORDS_FILE_PATH: ${{ vars.WORDS_FILE_PATH }}
          LOGGING_CONFIG_LOCATION: ${{ vars.LOGGING_CONFIG_LOCATION }}
